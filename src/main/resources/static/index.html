<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatchBridge</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="navbar">
    <div class="nav-content">
        <h1><i class="fa-solid fa-graduation-cap"></i> BatchBridge</h1>
        <button id="uploadBtn" class="btn btn-primary"><i class="fa-solid fa-upload"></i> Upload Note</button>
    </div>
</header>

<main class="container">
    <section class="search-section">
        <h2>Search Notes</h2>
        <div class="search-grid">
            <input type="text" id="searchKeyword" placeholder="Search by keyword...">
            <input type="text" id="searchSubject" placeholder="Subject">
            <select id="searchSemester">
                <option value="">All Semesters</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>
            <select id="searchDepartment">
                <option value="">All Departments</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics">Electronics</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
                <option value="Electrical">Electrical</option>
            </select>
            <button id="searchBtn" class="btn btn-secondary"><i class="fa-solid fa-search"></i> Search</button>
            <button id="clearBtn" class="btn btn-outline"><i class="fa-solid fa-rotate"></i> Clear</button>
        </div>
    </section>

    <section class="notes-section">
        <h2>Available Notes <span id="noteCount" class="badge">0</span></h2>
        <div id="loadingIndicator" class="loading hidden">Loading...</div>
        <div id="notesGrid" class="notes-grid"></div>
        <p id="noResults" class="no-results hidden">No notes found. Try a different search.</p>
    </section>
</main>

<div id="noteModal" class="modal hidden">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2 id="modalTitle">Upload New Note</h2>
        <form id="noteForm" enctype="multipart/form-data">
            <input type="hidden" id="noteId">

            <label>Title *</label>
            <input type="text" id="title" required placeholder="e.g. Data Structures Unit 1">

            <label>Description</label>
            <textarea id="description" rows="3" placeholder="Brief description of the notes"></textarea>

            <div class="form-row">
                <div>
                    <label>Subject *</label>
                    <input type="text" id="subject" required placeholder="e.g. Data Structures">
                </div>
                <div>
                    <label>Semester *</label>
                    <select id="semester" required>
                        <option value="">Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>Department *</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="Electrical">Electrical</option>
                    </select>
                </div>
                <div>
                    <label>Your Name *</label>
                    <input type="text" id="uploadedBy" required placeholder="e.g. John Doe">
                </div>
            </div>

            <label>File (PDF, DOC, PPT, TXT, ZIP - Max 20MB)</label>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.zip">
            <small id="currentFileInfo"></small>

            <div class="modal-actions">
                <button type="submit" class="btn btn-primary">Save Note</button>
                <button type="button" id="cancelBtn" class="btn btn-outline">Cancel</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/script.js"></script>
</body>
</html>
